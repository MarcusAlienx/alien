# Firebase Data Connect GraphQL Schema
# Represenation of alien.mx tables (Users, Products, Sightings) backed by PostgreSQL/Cloud SQL.

type User @table {
  id: String! @column(name: "id")
  openId: String! @unique
  name: String
  email: String
  loginMethod: String
  role: String! @default(value: "user")
  membershipTier: String! @default(value: "initiate")
  xp: Int! @default(value: 0)
  # Float replaces decimal precision for GraphQL basic types, but Postgres handles numeric
  tokenBalance: Float! @default(value: 0.0)
  walletAddress: String
  avatarUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  lastSignedIn: Timestamp! @default(expr: "request.time")

  # Relationships
  sightings: [Sighting!]!
  cartItems: [CartItem!]!
  orders: [Order!]!
  sightingVotes: [SightingVote!]!
  scores: [Score!]!
  activities: [ActivityFeed!]!
}

type Product @table {
  id: String! @column(name: "id")
  slug: String! @unique
  name: String!
  category: String!
  description: String
  priceMxn: Float!
  imageUrl: String
  badge: String
  inStock: Boolean! @default(value: true)
  # Sizes array can be stored as JSON
  sizes: Any
  amazonAsin: String
  mercadolibreId: String
  featured: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Relationships
  cartItems: [CartItem!]!
}

type CartItem @table {
  id: String! @column(name: "id")
  user: User! @ref
  product: Product! @ref
  quantity: Int! @default(value: 1)
  size: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Order @table {
  id: String! @column(name: "id")
  user: User! @ref
  # JSON representation of items
  items: Any!
  subtotalMxn: Float!
  discountMxn: Float! @default(value: 0.0)
  totalMxn: Float!
  paymentMethod: String! @default(value: "card")
  status: String! @default(value: "pending")
  shippingName: String
  shippingAddress: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Sighting @table {
  id: String! @column(name: "id")
  # Foreign key to User
  user: User @ref
  title: String!
  description: String
  lat: Float!
  lng: Float!
  locationName: String
  level: Int! @default(value: 1)
  votes: Int! @default(value: 0)
  status: String! @default(value: "pending")
  createdAt: Timestamp! @default(expr: "request.time")

  # Relationships
  sightingVotes: [SightingVote!]!
}

type SightingVote @table {
  id: String! @column(name: "id")
  sighting: Sighting! @ref
  user: User! @ref
  createdAt: Timestamp! @default(expr: "request.time")
}

type Score @table {
  id: String! @column(name: "id")
  user: User! @ref
  game: String! @default(value: "crypto_crash")
  score: Int!
  multiplier: Float
  createdAt: Timestamp! @default(expr: "request.time")
}

type NewsPost @table {
  id: String! @column(name: "id")
  slug: String! @unique
  title: String!
  excerpt: String
  body: String
  category: String! @default(value: "editorial")
  imageUrl: String
  authorName: String
  published: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Vector Search Embedding for pgvector Support
  embedding: Vector @col(size: 768)
}

type ActivityFeed @table {
  id: String! @column(name: "id")
  user: User @ref
  actorName: String
  type: String! @default(value: "system")
  message: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
